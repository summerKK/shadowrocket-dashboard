name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: arm64
            arch: arm64
            name: Apple Silicon (M1/M2/M3/M4)
          - target: x64
            arch: x64
            name: Intel Core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Sync Version from Git Tag
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "Setting package.json version to: $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS Binary & DMG (${{ matrix.arch }})
        run: |
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract Tag Message & Generate Notes
        id: release_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          TAG_BODY=$(git tag -l --format='%(contents)' "$TAG_NAME")
          if [ -z "$TAG_BODY" ]; then
            TAG_BODY="## 🚀 What's Changed in $TAG_NAME"
          fi
          echo "title=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_notes.outputs.title }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
