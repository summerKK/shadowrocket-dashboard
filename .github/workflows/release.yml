name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: arm64
            arch: arm64
            name: Apple Silicon (M1/M2/M3/M4)
          - target: x64
            arch: x64
            name: Intel Core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Sync Version from Git Tag
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "Setting package.json version to: $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS Binary & DMG (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --mac --${{ matrix.arch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Extract Tag Message
        id: tag_message
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_BODY=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          if [ -z "$TAG_BODY" ]; then
            TAG_BODY="Release ${{ github.ref_name }}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.tag_message.outputs.notes }}
          files: |
            dist/*.dmg
            dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
